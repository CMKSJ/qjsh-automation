<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q将水浒 · 自动化面板</title><style>
:root{--bg:#0f1420;--card:#1a2233;--line:#2a3550;--txt:#e8ecf4;--dim:#8a94ab;--acc:#4f8cff;--ok:#3fb96f;--warn:#e6a23c;--err:#e5646c;--purple:#a875ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:16px;max-width:860px;margin:0 auto}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

#tokbanner ol{margin:6px 0 0 18px;font-size:12.5px}
</style></head><body>
<div id="toast"></div>
<h1><span class="dot" id="hdot"></span>Q将水浒 · 自动化面板 <span class="tag" id="runstate"></span><span class="tag" id="hserver"></span><button id="pauser" class="soft" style="margin-left:auto" onclick="togglePause()">⏸</button><button id="sndbtn" class="soft" onclick="toggleSnd()">🔔</button></h1>

  <div class="row" style="margin-top:10px">

<div class="card"><h2>日志</h2><div class="log" id="log"></div></div>
<script>
const KEY='';
const ORIGIN='https://qjsh.duckdns.org';
const $=id=>document.getElementById(id);
function toast(t,ok){var e=$('toast');e.textContent=t;e.style.display='block';e.style.borderColor=ok===false?'var(--err)':'var(--acc)';clearTimeout(window.__tt);window.__tt=setTimeout(function(){e.style.display='none'},4000)}
let audioCtx=null,soundOn=localStorage.getItem('snd')!=='0';
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{once:true});
function beep(){if(!soundOn)return;try{unlockAudio();if(!audioCtx||audioCtx.state!=='running')return;var t=audioCtx.currentTime;[[880,0],[1174,0.16],[1568,0.32]].forEach(function(fd){var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=fd[0];o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.0001,t+fd[1]);g.gain.exponentialRampToValueAtTime(0.25,t+fd[1]+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+fd[1]+0.45);o.start(t+fd[1]);o.stop(t+fd[1]+0.5)})}catch(e){}}
function toggleSnd(){soundOn=!soundOn;localStorage.setItem('snd',soundOn?'1':'0');$('sndbtn').textContent=soundOn?'🔔':'🔕';$('sndbtn').title=soundOn?'提示音已开启，点击关闭':'提示音已关闭，点击开启';$('sndbtn').style.opacity=soundOn?'1':'0.5';if(soundOn){unlockAudio();beep()}}
const BM='javascript:(function(){var W=\''+ORIGIN+'\';function arm(){window.__qjsh=1;var F=window.fetch,X=XMLHttpRequest.prototype.open,S=XMLHttpRequest.prototype.setRequestHeader;function ok(t){try{navigator.sendBeacon(W+\'/api/report-token\',JSON.stringify({token:t}))}catch(e){}window.fetch=F;XMLHttpRequest.prototype.setRequestHeader=S;XMLHttpRequest.prototype.open=X;window.__qjsh=2}window.fetch=function(i,o){try{var u=\'\'+(i&&i.url||i);var h=(o&&o.headers)||(i&&i.headers),a=h&&(h.Authorization||(h.get&&h.get(\'Authorization\')));if(a&&u.indexOf(\'/auth/\')<0)ok(String(a).replace(\'Bearer \',\'\'))}catch(e){}return F.apply(this,arguments)};XMLHttpRequest.prototype.open=function(m,u){this.__u=u;return X.apply(this,arguments)};XMLHttpRequest.prototype.setRequestHeader=function(k,v){try{if(String(k).toLowerCase()==\'authorization\'&&v&&(\'\'+this.__u).indexOf(\'/auth/\')<0)ok(String(v).replace(\'Bearer \',\'\'))}catch(e){}return S.apply(this,arguments)}}if(window.__qjsh===1)return alert(\'监听已开启，请在游戏里点任意操作\');arm();alert(\'监听已开启：在游戏里点击任意操作（或等几秒），token 会自动上报\')})()';
async function req(path,opts={}){const r=await fetch('api/'+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});return r.json()}
function copyBM(){var t=$('bmcode').textContent||BM;function ok(){toast('已复制！去浏览器「添加书签」，把网址替换为这段代码')}function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);var s=false;try{s=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);s?ok():prompt('复制失败，请长按下面文本框手动复制:',t)}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else{fb()}}
const CUR={COPPER:'铜钱',YUANBAO:'元宝',SILVER_TICKET:'银票',PROVISIONS:'粮草',BATTLE_ACHIEVEMENT:'战功'};
function fmt(n){return (+n).toLocaleString('zh-CN')}
function fmtBJ(iso){var d=new Date(iso);if(isNaN(d))return '';d=new Date(d.getTime()+8*3600e3);var p=x=>String(x).padStart(2,'0');return p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())}
function cd(iso){const s=Math.floor((new Date(iso)-Date.now())/1000);if(s<=0)return '—';const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h>0?h+'小时'+m+'分':m+'分'+String(s%60).padStart(2,'0')+'秒'}
setInterval(function(){document.querySelectorAll('.cd[data-until]').forEach(function(e){e.textContent=cd(e.getAttribute('data-until'))})},1000);
const inflight=new Set();
let knownHeroKeys=null;
async function render(){
  try{
    const s=await req('status');
    const hasTok=!!(s.token&&s.token.hasToken);
    $('tokbanner').hidden=hasTok;
    if(!hasTok)$('bmcode').textContent=BM;
    $('hserver').textContent=(s.state?.serverId||'');
    try{const seen=JSON.parse(localStorage.getItem('nids')||'[]');(s.notices||[]).forEach(function(n){if(seen.indexOf(n.id)<0){toast(n.msg,false);seen.push(n.id)}});localStorage.setItem('nids',JSON.stringify(seen.slice(-30)))}catch(e){}
    $('hdot').style.background=hasTok?'var(--ok)':'var(--err)';
    if(s.snapshot?.player){const p=s.snapshot.player;$('player').innerHTML='<b>'+p.displayName+'</b> Lv'+p.level+' · 战力 '+fmt(p.combatPower||0)}else if(s.token&&s.token.token){$('player').textContent='token 已生效，账号数据将在整点任务时刷新'}
    $('cur').innerHTML=(s.snapshot?.currencies||[]).filter(c=>c.code!=='PROVISIONS').map(c=>'<span>'+(CUR[c.code]||c.code)+' <b>'+fmt(c.balance)+'</b></span>').join('');
    const d=s.daily||{signin:false,mining:0,hourly:{}};
    const hrs=Object.keys(d.hourly||{}).length;
    const provC=(s.snapshot?.currencies||[]).find(c=>c.code==='PROVISIONS');
    const provNow=provC?provC.balance:'-';
    const provCap=s.snapshot?.player?.provisionsCapacity??'-';
    window.__cap=s.snapshot?.heroCapacity||null;
    window.__heroes=s.heroes||{};
    $('sndbtn').textContent=soundOn?'🔔':'🔕';$('sndbtn').title=soundOn?'提示音已开启，点击关闭':'提示音已关闭，点击开启';$('sndbtn').style.opacity=soundOn?'1':'0.5';
    const act=s.activity||{};
    $('hserver').textContent=(s.state?.serverId||'');
    try{const seen=JSON.parse(localStorage.getItem('nids')||'[]');(s.notices||[]).forEach(function(n){if(seen.indexOf(n.id)<0){toast(n.msg,false);seen.push(n.id)}});localStorage.setItem('nids',JSON.stringify(seen.slice(-30)))}catch(e){}
    window.__paused=!!s.paused;
    const PB='<span style="display:flex;gap:4px;align-items:center;height:15px"><i style="display:block;width:4px;height:15px;background:currentColor;border-radius:1px"></i><i style="display:block;width:4px;height:15px;background:currentColor;border-radius:1px"></i></span>',PT='<span style="display:block;width:0;height:0;border-top:7.5px solid transparent;border-bottom:7.5px solid transparent;border-left:11px solid currentColor;margin:0 auto"></span>';
    $('pauser').innerHTML=window.__paused?PT:PB;
    window.__soul=s.soulFactory===true;
    $('soulbtn').style.color=window.__soul?'var(--ok)':'var(--err)';
    $('soulbtn').style.borderColor=window.__soul?'rgba(63,185,111,.45)':'rgba(229,100,108,.45)';
    $('soulbtn').style.background=window.__soul?'rgba(63,185,111,.13)':'rgba(229,100,108,.13)';
    $('soulbtn').title=window.__soul?'将魂工厂运行中，点击关闭':'将魂工厂已关闭，点击开启';
    $('runstate').textContent=window.__paused?'已暂停':'运行中';
    $('runstate').style.color=window.__paused?'var(--err)':'var(--ok)';
    $('pauser').title=window.__paused?'已暂停，点击恢复运行':'运行中，点击暂停';
    $('pauser').style.borderColor=window.__paused?'rgba(229,100,108,.45)':'rgba(63,185,111,.45)';
    $('pauser').style.color=window.__paused?'var(--err)':'var(--ok)';
    $('pauser').style.background=window.__paused?'rgba(229,100,108,.13)':'rgba(63,185,111,.13)';
        if(window.__cap){const full=window.__cap.owned>=window.__cap.capacity;$('herocap').innerHTML='武将 <span style="color:'+(full?'var(--err)':'var(--ok)')+'">'+window.__cap.owned+'</span>/<span style="color:var(--acc)">'+window.__cap.capacity+'</span>';}else{$('herocap').textContent='';}
    window.__autoReserve=s.autoReserve!==false;
    $('arstate').textContent=window.__autoReserve?'自动预约':'暂停收购';
    $('arstate').style.color=window.__autoReserve?'var(--ok)':'var(--err)';
    $('autores').textContent='🎯';
    $('autores').style.color=window.__autoReserve?'var(--ok)':'var(--err)';
    $('autores').style.borderColor=window.__autoReserve?'rgba(63,185,111,.45)':'rgba(229,100,108,.45)';
    $('autores').style.background=window.__autoReserve?'rgba(63,185,111,.13)':'rgba(229,100,108,.13)';
    $('autores').title=window.__autoReserve?'自动预约中，点击暂停收购':'已暂停收购，点击恢复自动预约';
    const ter=s.snapshot&&s.snapshot.territory,res=s.snapshot&&s.snapshot.resources;
    const RN={FOREST:'森林',SWAMP:'沼泽',FARMLAND:'农田',GRASSLAND:'草原',HILL:'山地'};
    const LVC=l=>l>=50?'#ff7d84':l>=40?'#ffc46b':l>=30?'#c9a6ff':l>=20?'#8ab4ff':l>=10?'#8fd8a0':'#e8ecf4';
    const xy=(x,y,fr)=>'<span style="color:'+(x>=y?(fr?'var(--err)':'var(--acc)'):'var(--ok)')+'">'+x+'</span>/<span style="color:var(--acc)">'+y+'</span>';
    let dh='';
    dh+='<div class="kv"><span>签到</span>'+(d.signin?'':'<a class="miniact" style="margin-left:auto" onclick="job(\'signin\')">立即签到</a>')+'<b>'+(d.signin?'✓ 已完成':'')+'</b></div>';
dh+='<div class="kv"><span>矿山</span>'+(d.mining<10?'<a class="miniact" style="margin-left:auto" onclick="job(\'mine\')">开采</a>':'')+'<b><span style="color:'+(d.mining>=10?'var(--acc)':'var(--ok)')+'">'+d.mining+'</span>/10</b></div>';
dh+='<div class="kv"><span>整点任务</span><a class="miniact" style="margin-left:auto" onclick="job(\'hourly\')">立即执行</a><b>'+hrs+' 次</b></div>';
    dh+='<div class="kv"><span>粮草</span><b>'+xy(provNow,provCap,true)+'</b></div>';
    dh+='<div class="kv"><span>领地</span><b>'+(ter?xy(ter.cities,ter.slots):'-')+'</b></div>';
    dh+='<div class="kv"><span>资源点</span><b>'+(res?xy(res.occupied,res.slots):'-')+'</b></div>';
    const souls=s.souls||{};
    const SCOL={GREEN:'#8fd8a0',BLUE:'#8ab4ff',PURPLE:'#c9a6ff',ORANGE:'#ffc46b'};
    const SNAME={GREEN:'绿',BLUE:'蓝',PURPLE:'紫',ORANGE:'橙'};
    const soulTxt=Object.keys(souls).length?Object.entries(souls).map(function(e2){return '<span style="color:'+(SCOL[e2[0]]||'var(--txt)')+'">'+(SNAME[e2[0]]||e2[0])+e2[1]+'</span>'}).join('·'):'0';
    dh+='<div class="kv"><span>提魂</span><b>'+soulTxt+'</b></div>';
    $('daily').innerHTML=dh;
    const tr=(s.snapshot&&s.snapshot.training)||[];
    const rm=[];
    $('trainingbox').innerHTML=tr.map(function(t){
      return '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+t.hero+' <span style="color:'+LVC(t.level||0)+'">Lv'+(t.level||'?')+'</span></span><b><span class="cd" data-until="'+t.endsAt+'">'+cd(t.endsAt)+'</span></b></div>'}).join('')
      +(tr.length&&((s.snapshot&&s.snapshot.resources&&(s.snapshot.resources.marches||[]).length)||(res&&res.garrisons&&res.garrisons.length))?'<div style="border-top:1px solid var(--line);margin:6px 0"></div>':'')
      +rm.map(function(m){return '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+m.hero+' <span style="color:'+'var(--acc)'+'">'+m.phase+'</span></span><b><span class="cd" data-until="'+m.endsAt+'">'+cd(m.endsAt)+'</span></b></div>'}).join('')
      +(res&&res.garrisons?res.garrisons.map(function(g){var tp=g.type?' '+(RN[g.type]||g.type)+'Lv'+g.level:'';var ph=g.phase||'占领中';var pc=ph==='占领中'?'var(--ok)':'var(--acc)';return '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+g.hero+tp+' <span style="color:'+pc+'">'+ph+'</span></span><b><span class="cd" data-until="'+g.endsAt+'">'+cd(g.endsAt)+'</span></b></div>'}).join(''):'')
      +((tr.length||rm.length||(res&&res.garrisons&&res.garrisons.length))?'':'<div class="muted">无训练/行军/占领</div>');
    for(const h of Object.values(s.heroes||{})){
      if(h.reserved&&h.status==='ALIVE'){
        const dt=new Date(h.protectionEndsAt)-Date.now();
        if(dt<=0&&!inflight.has(h.key)){inflight.add(h.key);grab(h.key).finally(()=>inflight.delete(h.key));}
        else if(dt>0&&dt<3600000&&!window.__armed){/* armed 初始化见下 */}
      }
    }
    (window.__armed=window.__armed||{});
    for(const h of Object.values(s.heroes||{})){
      if(h.reserved&&h.status==='ALIVE'&&h.protectionEndsAt){
        const at=h.protectionEndsAt;
        if(window.__armed[h.key]&&window.__armed[h.key].at!==at){clearTimeout(window.__armed[h.key].t);window.__armed[h.key]=null}
        if(!window.__armed[h.key]){
          const dt=new Date(at)-Date.now();
          if(dt>0&&dt<3600000){
            window.__armed[h.key]={at:at,t:setTimeout(function(k){return function(){grab(k)}}(h.key),Math.max(0,dt-150))};
          }
        }
      }
    }
    const GRP={GRABBED:0,GONE:1,ALIVE:2};
    const hs=Object.values(s.heroes||{}).map(h=>{h.__exp=h.status==='ALIVE'&&new Date(h.protectionEndsAt)<=new Date();return h}).sort(function(a,b){
      const ga=a.__exp||a.status!=='ALIVE'?GRP[a.status]||3:3,gb=b.__exp||b.status!=='ALIVE'?GRP[b.status]||3:3;
      const rank=function(h){return h.status==='ALIVE'?(h.__exp?GRP.ALIVE:3):GRP[h.status]};
      const ra=rank(a),rb=rank(b);
      if(ra!==rb)return ra-rb;
      if(ra===3)return new Date(a.protectionEndsAt)-new Date(b.protectionEndsAt);
      const qa=a.quality==='ORANGE'?1:0,qb=b.quality==='ORANGE'?1:0;
      const asc=(ra===2||ra===3);  // 在售/保留组升序；购得/售罄组降序
      return qb-qa||(asc?a.star-b.star:b.star-a.star);
    });
    const liveKeys=hs.filter(h=>h.status==='ALIVE').map(h=>h.key);

      for(const k of liveKeys){if(!knownHeroKeys.has(k)){const nh=hs.find(x=>x.key===k);const label=nh?(nh.hero+'('+nh.quality+nh.star+'星 @'+nh.owner+'家)'):k;toast('发现新目标: '+label);beep()}}
      knownHeroKeys=new Set(liveKeys);
    }
    $('heroes').innerHTML=hs.length?('<table><tr><th>武将</th><th>酒馆主人</th><th>成本</th><th>保护期</th><th>状态</th><th>操作</th></tr>'+
      hs.map(h=>{const k=h.key.replace(/"/g,'&quot;');
        const stOpen=h.status==='ALIVE'&&!h.reserved&&new Date(h.protectionEndsAt)<=new Date();
        const st=h.status==='GRABBED'?'<span class="st-GRABBED">购得</span>':h.status==='GONE'?'<span class="st-GONE">售罄</span>':h.reserved?'<span class="st-ALIVE">已预约</span>':stOpen?'<span class="st-ALIVE">在售</span>':'<span class="st-ALIVE">保留</span>';
        const expired=new Date(h.protectionEndsAt)<=new Date();
        const btn=h.status!=='ALIVE'?'':h.reserved
          ?'<button class="ghost" onclick="res(\''+k+'\')">取消</button> <button class="warn" onclick="grab(\''+k+'\')">抢购</button>'
          :expired?'<button class="warn" onclick="grab(\''+k+'\')">抢购</button>'
          :'<button onclick="res(\''+k+'\')">预约</button>';
        const cdtxt=h.status==='ALIVE'?'<span class="cd" data-until="'+h.protectionEndsAt+'">'+cd(h.protectionEndsAt)+'</span>':'—';
        return '<tr><td><span class="q q-'+h.quality+'">'+(h.quality==='PURPLE'?'紫':'橙')+'</span> '+h.hero+' '+h.star+'星</td><td>'+h.owner+(h.shortId?'('+h.shortId+')':'(Lv'+h.ownerLevel+')')+'</td><td>'+(h.status==='GRABBED'?(h.paidCopper!=null?fmt(h.paidCopper)+'铜'+(h.paidTicket?'+'+h.paidTicket+'票':''):'—'):(h.copperCost!=null?fmt(h.copperCost)+'铜'+(h.silverTicketCost?'+'+h.silverTicketCost+'票':''):'—'))+'</td><td>'+cdtxt+'</td><td>'+st+'</td><td style="white-space:nowrap">'+btn+'</td></tr>'}).join('')+'</table>')
      :'<p class="muted">暂无监控目标</p>';
    $('log').innerHTML=(s.log||[]).slice(0,120).map(l=>'<div><time>'+fmtBJ(l.t)+'</time><span class="lv-'+l.level+'">'+l.msg+'</span></div>').join('');
  }catch(e){if(e!==0)console.error(e)}
}
function capFull(){const c=window.__cap;return !!(c&&c.capacity>0&&c.owned>=c.capacity)}
async function toggleSoul(){await req('soul-factory',{method:'POST',body:JSON.stringify({enabled:!window.__soul})});setTimeout(render,1000)}
async function toggleAutoRes(){await req('auto-reserve',{method:'POST',body:JSON.stringify({enabled:!window.__autoReserve})});render()}
async function togglePause(){const r=await req('pause',{method:'POST',body:JSON.stringify({paused:!window.__paused})});render()}
async function res(k){const r=await req('reserve',{method:'POST',body:JSON.stringify({key:k})});if(r&&r.warn)toast(r.warn,false);render()}
async function grab(k){const r=await req('grab',{method:'POST',body:JSON.stringify({key:k})});if(!r.ok)toast(r.msg||'抢购失败',false);else toast('已抢到 '+r.msg.replace('已抢到 ',''),true);render()}
async function job(n){const r=await req('job',{method:'POST',body:JSON.stringify({name:n})});if(n==='refresh')setTimeout(render,3000);const res=r.result;let txt=Array.isArray(res)?res.join('\n'):(''+res);if(r.found&&r.found.length)txt+='\n'+r.found.join('\n');toast(txt||'已执行');setTimeout(render,800)}
render();setInterval(render,10000);
</script></body></html>
